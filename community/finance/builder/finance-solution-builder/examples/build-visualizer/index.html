  function renderGoal(){const s=data.solution,t=data.story;return `<div class="page-shell">${pageTitle('01','明确业务需求','先明确要解决的问题、服务对象和业务目标，再进入 Solution 设计。')}<div class="goal-hero"><div><small>${esc(t.audience)}</small><h3>${esc(s.displayName)}</h3><p>${esc(t.purpose)}</p></div><div class="goal-route"><div class="goal-route-flow"><div class="goal-route-step"><small>01 · 业务需求</small><b>${esc(t.scenario)}</b></div><div class="goal-route-arrow">→</div><div class="goal-route-step"><small>02 · 方案边界</small><b>确定目标、使用者、能力和验收要求</b></div><div class="goal-route-arrow">→</div><div class="goal-route-step"><small>03 · 组成设计</small><b>选择资产并明确连接关系</b></div><div class="goal-route-arrow">→</div><div class="goal-route-step"><small>04 · BUILDER 执行</small><b>装配、验证、评估并裁决交付</b></div></div><p><b>这条链路的作用：</b>业务需求先明确要解决的问题和使用者；Solution 先确定目标 Agent 的方案边界，再选择实现方案所需的资产和连接关系；Builder 按完整 Solution 进行装配、验证和评估。业务场景变化时可以调整 Solution，已有资产继续复用，构建过程保持稳定。</p></div></div><div class="goal-grid">${infoCard('使用者',t.audience,`Profile：${s.profileRef.id}；明确身份、交互方式和资料访问边界。`)}${infoCard('业务场景',t.scenario,t.purpose)}${infoCard('核心金融能力',t.capabilityId,`${t.capabilityLabel}；输入：${t.inputExample}。`)}${infoCard('连接的系统',t.systems,`通过 ${t.providerLabel} 调用；输出：${t.outputExample}。`)}</div></div>`}

  function renderNeeds(){const s=data.solution,p=s.domainPackRefs?.[0]||{},provider=s.providerRefs?.[0]||{},evalPack=s.evaluationPackRef||{};return `<div class="page-shell">${pageTitle('02','Builder 要装哪些东西','Builder 负责装配通用资产，银行项目团队负责连接本行系统；双方通过统一接口协作。')}<div class="responsibility-callout"><div class="role-step"><strong>Builder 负责</strong><span>选择并安装金融能力合同、专业包、运行环境和已实现的银行适配器。</span></div><div class="role-step"><strong>银行项目团队负责</strong><span>按照统一接口编写适配器，把本行 CRM、持仓和产品系统接进来。</span></div><div class="role-step value"><strong>这样做的价值</strong><span>Agent 能按统一方式使用不同银行的系统；Agent 升级或银行系统变化时，可以分别演进。</span></div></div><section class="architecture-map"><div class="arch-caption"><b>Agent 怎样取得银行数据和能力</b><span>请求和返回结果都遵循金融能力合同</span></div><div class="arch-grid"><div class="arch-box agent"><small>AGENT / 业务应用</small><b>OpenJiuwen Agent Candidate</b><span>${esc(s.displayName)} · 发起“查询访前客户信息”等标准请求</span></div><div class="arch-arrow"><strong>→</strong>① 请求金融能力</div><div class="arch-box harness"><small>FINANCE HARNESS / 金融能力底座</small><b>定义统一请求、统一结果和资产安装方式</b><div class="harness-parts"><div class="harness-part"><strong>财富专业包</strong><em>SOP · Skill · 专业方法</em></div><div class="harness-part contract"><strong>金融能力合同</strong><em>能力编号 · 输入 · 结果 · 如何继续</em></div><div class="harness-part"><strong>OpenJiuwen 接线</strong><em>注册能力 · 装入运行环境</em></div></div></div><div class="arch-arrow"><strong>→</strong>② 调用本行适配器</div><div class="system-stack"><div class="arch-box"><small>银行系统适配器</small><b>Provider</b><span>把统一请求翻译成本行系统 API</span></div><div class="arch-box"><small>银行已有系统</small><b>CRM · 持仓 · 产品</b><span>查询数据或执行操作</span></div></div></div><div class="architecture-support"><div class="support-card"><small>DEVELOPMENT / 开发态</small><b>Solution Builder</b><span>读取 Solution → 锁定资产版本 → 安装专业包与接线 → 绑定银行适配器 → 生成 Candidate</span></div><div class="support-card eval"><small>QUALITY GATE / 验收</small><b>Evaluation Pack</b><span>调用 Candidate 和银行测试系统，检查工程可运行性、业务准确率和响应时延。</span></div></div></section><div class="asset-section-title"><h3>本轮组建 Agent 所需的 8 类组件</h3><p>每张卡片都标明它在上方架构中的对应位置，以及与相邻组件协作时使用的接口。</p></div><div class="asset-grid">${assetModule('使用者 Profile',s.profileRef.id,'定义 Agent 面向谁使用以及协作边界','身份模式、权限边界、交互约束','Agent / 业务应用','Profile 配置')}${assetModule('推理模型',s.modelRef,'提供语言理解和推理能力','模型地址、模型参数、运行凭据引用','Agent / 业务应用','模型服务接口')}${assetModule('财富专业包',p.id,'经过审核的财富业务方法','SOP、Skill、提示资产、能力引用','Finance Harness / 财富专业包','专业包清单 / Skill 接口')}${assetModule('金融能力合同','wealth.previsit-context.query','统一业务接口说明书，定义 Agent 可以调用的金融能力','能力编号、输入、结果、续办和身份约束','Finance Harness / 金融能力合同','CapabilityRequestV1 / CapabilityResultV1',true)}${assetModule('银行系统适配器',provider.id,'把统一金融请求转换成本行系统调用的代码','CRM、持仓、产品等系统适配','银行系统适配器 / Provider','银行适配器接口（Provider SPI）')}${assetModule('OpenJiuwen 接线','runtime-integration','把金融能力注册进 Agent 运行环境','能力注册、Host Wiring、启动配置','Finance Harness / OpenJiuwen 接线','Java 集成接口')}${assetModule('Agent Runtime',s.runtime.family,'Candidate 的运行与服务底座','会话、服务入口、生命周期','OpenJiuwen Agent Candidate','OpenJiuwen Java 接口')}${assetModule('Evaluation Pack',evalPack.id,'可复用的业务验收标准','测试任务、指标、判定规则','Evaluation Pack / 质量门禁','评测包 / 报告接口')}<section class="contract-example"><h3>金融能力合同实例 · wealth.previsit-context.query</h3><div class="contract-flow"><b>能力编号</b><span>wealth.previsit-context.query</span><b>Agent 提供</b><span>客户引用、员工身份、业务目的</span><b>Agent 得到</b><span>客户上下文、数据状态、缺失项、来源证据</span><b>实际过程</b><span>Agent 提出统一请求 → Harness 校验并找到适配器 → 适配器调用本行 CRM / 持仓 / 产品系统 → 结果按统一格式返回</span></div><div class="contract-note"><b>Provider SPI 是什么：</b>Finance Harness 规定的一组银行适配器接口。银行项目团队实现这组接口，就能把本行系统接入 Builder 生成的 Agent。</div></section></div></div>`}

  function bindStageTabs(){document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{const scrollTop=$('page').scrollTop;selectedStage=Number(b.dataset.stage);renderPage();$('page').scrollTop=scrollTop})}
  function assemblyItems(){const s=data.solution,t=data.story,p=s.domainPackRefs?.[0]||{},provider=s.providerRefs?.[0]||{},e=s.evaluationPackRef||{},runtime=data.lock.runtimeTemplate||{},integration=data.lock.runtimeIntegration||{};return [
    {key:'solution',kind:'组件',group:'BUILDER INPUT',title:'Solution 构建输入',summary:'描述本轮要构建的 Agent 和全部资产引用。',input:'业务目标、使用者、Runtime、Pack、Provider、模型、Eval',output:'通过 Schema 校验的标准化 Solution',contract:'solution-build-input.v1 JSON Schema',schema:`{\n  "schemaVersion": "finance-agent-solution-build.v1",\n  "solutionId": "${s.solutionId}",\n  "profileRef": {"id": "${s.profileRef.id}", "version": "${s.profileRef.version}"},\n  "domainPackRefs": [{"id": "${p.id}", "version": "${p.version}"}],\n  "providerRefs": [{"id": "${provider.id}", "version": "${provider.version}"}]\n}`},

    {key:'domain-pack',kind:'组件',group:'DOMAIN PACK',title:p.id,summary:`安装“${t.scenario}”所需的 SOP、Skill 和能力引用。`,input:`${p.id}@${p.version}`,output:`${s.displayName} 的专业方法与 Skill`,contract:'finance-domain-pack.v1 / pack.yaml',schema:`{\n  "id": "${p.id}",\n  "version": "${p.version}",\n  "capabilityId": "${t.capabilityId}",\n  "source": "${p.source}"\n}`},
    {key:'provider',kind:'组件',group:'BANK ADAPTER',title:provider.id,summary:`把 ${t.capabilityId} 翻译为 ${t.systems} 的调用。`,input:'CapabilityRequestV1',output:'CapabilityResultV1',contract:'Provider SPI',schema:`{\n  "providerId": "${provider.id}",\n  "systems": "${t.systems}",\n  "request": "CapabilityRequestV1",\n  "result": "CapabilityResultV1"\n}`},
    {key:'integration',kind:'组件',group:'HOST WIRING',title:'OpenJiuwen 接线',summary:'把 Harness 能力和 Provider 注册进 OpenJiuwen Agent Host。',input:`${integration.source||s.runtime.integrationRef}`,output:'FinanceHarnessCapabilityAdapter + ProfileSupport',contract:'Java Host Wiring',schema:`{\n  "runtimeIntegration": "${integration.id||'runtime-integration'}",\n  "digest": "${short(integration.digest)}",\n  "host": "OpenJiuwen Java"\n}`},
    {key:'runtime',kind:'组件',group:'RUNTIME TEMPLATE',title:'OpenJiuwen Java 模板',summary:'作为 Candidate 的工程宿主，提供会话、服务入口和生命周期。',input:s.runtime.templateRef,output:'可编译、可启动的 Java 多模块工程',contract:'Maven module / OpenJiuwen Runtime API',schema:`{\n  "family": "${s.runtime.family}",\n  "language": "${s.runtime.language}",\n  "revision": "${short(runtime.revision)}",\n  "digest": "${short(runtime.digest)}"\n}`},
    {key:'model',kind:'组件',group:'MODEL',title:'推理模型引用',summary:'在运行时解析模型服务，凭据不写入 Solution。',input:s.modelRef,output:'Candidate 推理能力',contract:'环境变量引用',schema:`{\n  "modelRef": "${s.modelRef}",\n  "credentialPolicy": "runtime-resolved; not embedded"\n}`},
    {key:'eval-pack',kind:'组件',group:'QUALITY GATE',title:'Evaluation Pack',summary:'提供冻结回放与在线业务验收的测试任务和裁决规则。',input:`${e.id}@${e.version}`,output:'评测结果与优化反馈',contract:'finance.skill-eval.pack.v1 / report.v1',schema:`{\n  "id": "${e.id}",\n  "version": "${e.version}",\n  "source": "${e.source}"\n}`},
    {key:'solution-schema',kind:'接口',group:'01 · READ',title:'Solution → Builder',summary:'Builder 只接受符合构建输入 Schema 的配置。',input:'SolutionBuildInputV1',output:'标准化 Solution',contract:'solution-build-input.v1.schema.json',schema:`required: [schemaVersion, solutionId, displayName, runtime,\n  profileRef, domainPackRefs, providerRefs, modelRef, evaluationPackRef]`},
    {key:'asset-lock',kind:'接口',group:'02 · RESOLVE',title:'AssetRef → Lock',summary:'解析 id、version、source，并以 SHA-256 固定内容。',input:'AssetRef { id, version, source, digest? }',output:'ResolvedAsset + solution-lock.json',contract:'finance-solution-lock.v1',schema:`{\n  "id": "asset-id",\n  "version": "0.1.0",\n  "source": "repo://...",\n  "digest": "sha256:...",\n  "status": "resolved"\n}`},

    {key:'evaluation-contract',kind:'接口',group:'06 · VERIFY',title:'Candidate → Evaluation',summary:`Evaluation 检查 ${t.evaluationFocus}，输出报告与修正建议。`,input:'Candidate + Eval Pack + 授权业务环境',output:'report.v1 + Bad Case + 优化建议',contract:'finance.skill-eval.pack.v1',schema:`{\n  "evaluationFocus": "${t.evaluationFocus}",\n  "candidate": "${s.displayName}",\n  "result": "report.v1"\n}`}
  ]}
  function assemblyItem(){const items=assemblyItems();return items.find(item=>item.key===selectedAssembly)||items[0]}
  function renderAssemblyInspector(){const item=assemblyItem();return `<section class="assembly-inspector"><div class="inspector-head"><div><small>${esc(item.group)}</small><h3>${esc(item.title)}</h3><p>${esc(item.summary)}</p></div><span class="inspector-kind">${esc(item.kind)}详情</span></div><div class="inspector-grid"><div class="inspector-field"><span>输入</span><b>${esc(item.input)}</b></div><div class="inspector-field"><span>输出</span><b>${esc(item.output)}</b></div><div class="inspector-field"><span>使用的接口</span><b>${esc(item.contract)}</b></div><div class="inspector-field"><span>本轮作用</span><b>${esc(item.summary)}</b></div><div class="schema-panel"><span>接口数据结构 / 本轮实例</span><pre>${esc(item.schema)}</pre></div></div></section>`}
  function renderAssemblyCycle(){const s=data.solution,t=data.story;const nodes=[
    ['n1','solution','01 · INPUT','读取 Solution','识别目标和资产引用'],
    ['n2','harness','02 · LOCK','锁定资产','解析版本、来源和摘要'],

    ['n7','capability-binding','07 · OPTIMIZE','归因并回流','选择责任组件后重新构建']
  ];return `<section class="assembly-visual"><div class="assembly-visual-head"><h3>一轮装配与优化是怎样循环的</h3><p>虚线和光点持续表示 Builder 的执行方向；点击任一节点，会同步选中下方组件或接口并展示本轮数据。</p></div><div class="cycle-stage"><svg viewBox="0 0 1200 390" preserveAspectRatio="none" aria-hidden="true"><path class="cycle-glow" d="M600 38 C900 38 1080 105 1080 198 C1080 315 850 355 600 350 C330 355 120 315 120 198 C120 105 300 38 600 38 Z"/><path id="assemblyCyclePath" class="cycle-track" d="M600 38 C900 38 1080 105 1080 198 C1080 315 850 355 600 350 C330 355 120 315 120 198 C120 105 300 38 600 38 Z"/><circle r="7" fill="#43866f"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#assemblyCyclePath"/></animateMotion></circle></svg><div class="cycle-center"><small>BUILD TARGET</small><b>${esc(s.displayName)}</b><span>${esc(t.audience)} · ${esc(t.capabilityId)}<br>当前点击：${esc(assemblyItem().title)}</span></div>${nodes.map((node,index)=>`<button class="cycle-node ${node[0]} ${selectedAssembly===node[1]?'active':''}" style="--delay:-${index}s" data-assembly-key="${esc(node[1])}"><small>${esc(node[2])}</small><b>${esc(node[3])}</b><span>${esc(node[4])}</span></button>`).join('')}</div></section>`}
  function renderAssemblyExplorer(){const items=assemblyItems(),components=items.filter(item=>item.kind==='组件'),interfaces=items.filter(item=>item.kind==='接口');return `${renderAssemblyCycle()}<section class="assembly-section"><div class="assembly-heading"><h3>图中使用的组件</h3><p>选中组件后，下方详情会显示它的输入、输出、版本引用和接口数据结构。</p></div><div class="component-picker">${components.map(item=>`<button class="component-button ${item.key===selectedAssembly?'active':''}" data-assembly-key="${esc(item.key)}"><small>${esc(item.group)}</small><b>${esc(item.title)}</b><span>${esc(item.output)}</span></button>`).join('')}</div></section><section class="assembly-section"><div class="assembly-heading"><h3>组件之间的接口链</h3><p>从 Solution Schema 到 Evaluation Report，每个接口都有稳定的输入和输出。</p></div><div class="interface-picker compact">${interfaces.map(item=>`<button class="interface-button ${item.key===selectedAssembly?'active':''}" data-assembly-key="${esc(item.key)}"><small>${esc(item.group)}</small><b>${esc(item.title)}</b><span>${esc(item.contract)}</span></button>`).join('')}</div>${renderAssemblyInspector()}</section>`}
  function bindAssemblyExplorer(){document.querySelectorAll('[data-assembly-key]').forEach(button=>button.onclick=()=>{const scrollTop=$('page').scrollTop;selectedAssembly=button.dataset.assemblyKey;renderPage();$('page').scrollTop=scrollTop})}
  function renderAssemblyOptimization(){return `<section class="optimization-explainer"><h3>Builder 怎样根据验收结果继续优化</h3><p>每轮都保持资产版本和评测口径可追溯。Evaluation 返回未通过项后，Builder 将问题定位到具体组件，只修正责任对象，再生成新 Candidate 并使用同一 Eval Pack 重验。</p><div class="optimization-flow"><div class="optimization-node"><small>01 · OBSERVE</small><b>读取失败证据</b><span>收集工程门禁、接口返回、准确率、时延和 Bad Case。</span></div><div class="optimization-node"><small>02 · ATTRIBUTE</small><b>定位责任组件</b><span>区分 Pack、合同、Provider、接线、模型或运行环境问题。</span></div><div class="optimization-node"><small>03 · REBUILD</small><b>修正并重新锁定</b><span>只替换目标组件，生成新的 Lock 与 Candidate。</span></div><div class="optimization-node"><small>04 · RE-EVALUATE</small><b>同口径重验</b><span>在相同 Eval Pack 和银行测试环境下比较前后结果。</span></div></div><div class="section-note"><b>本轮闭环进度：</b>观察与归因已经完成，修正对象定位为运行环境配置；自动改写资产尚未发生，待部署身份、指标门槛和授权客户就绪后执行在线重验。</div></section>`}
  function renderAssemble(){const indices=[1,2];if(!indices.includes(selectedStage))selectedStage=1;return `<div class="page-shell">${pageTitle('03','Builder 完成确定性装配',`${data.solution.displayName} 使用 ${data.solution.domainPackRefs[0].id}、${data.solution.providerRefs[0].id} 和 ${data.story.capabilityId} 完成装配。`)}${renderAssemblyExplorer()}${renderAssemblyOptimization()}<section class="assembly-section"><div class="assembly-heading"><h3>本轮真实装配执行</h3><p>选择阶段，查看 Builder 的输入、产出、通过标准和命令证据。</p></div>${stageTabs(indices)}${stageDetail(data.stages[selectedStage])}</section></div>`}
  function renderRuntime(){const indices=[3,4,5,6,7];if(!indices.includes(selectedStage))selectedStage=3;return `<div class="page-shell">${pageTitle('04','逐级证明 Candidate 能够运行','Builder 自动完成本地依赖安装、编译、启动和健康检查；银行业务接口需要在授权测试环境中逐项验证返回。')}<div class="runtime-route"><div class="route-node local"><small>BUILDER · LOCAL</small><b>自动部署 Candidate</b><span>安装依赖、编译 JAR、启动进程并执行健康检查。</span></div><div class="route-node"><small>AGENT</small><b>发起能力请求</b><span>Candidate 生成 CapabilityRequestV1。</span></div><div class="route-node"><small>HARNESS</small><b>校验并路由</b><span>检查身份、能力编号和参数，选择 Provider。</span></div><div class="route-node"><small>PROVIDER</small><b>调用银行适配器</b><span>将统一请求翻译为本行接口调用。</span></div><div class="route-node external"><small>BANK · EXTERNAL</small><b>CRM · 持仓 · 产品</b><span>在银行授权测试环境中返回真实业务结果。</span></div></div><div class="gate-matrix"><div class="matrix-row header"><div>验证层</div><div>必须证明什么</div><div>本轮证据</div><div>状态</div></div><div class="matrix-row"><div>Builder 本地部署</div><div>依赖可安装、Candidate 可编译、进程可启动</div><div>Maven 构建、JAR 摘要、健康端点检查</div><div class="matrix-status">已通过</div></div><div class="matrix-row"><div>Harness 合同</div><div>CapabilityRequestV1 / ResultV1 可校验</div><div>Finance Harness 自动测试</div><div class="matrix-status">已通过</div></div><div class="matrix-row"><div>Provider 装配</div><div>声明的银行适配器和 Host Wiring 已进入 Candidate</div><div>Candidate 资产测试</div><div class="matrix-status">已通过</div></div><div class="matrix-row"><div>银行业务系统</div><div>CRM、持仓和产品接口对授权请求返回正常</div><div>需要 EA 部署身份和授权客户引用</div><div class="matrix-status pending">待在线验证</div></div></div><div class="section-note"><b>Builder 能独立处理本地部署：</b>从安装 Harness 依赖到启动 Candidate 均由构建流程自动完成。银行系统接入的最终结论来自在线业务验收。</div><section class="assembly-section"><div class="assembly-heading"><h3>查看本轮工程验证明细</h3><p>点击任一门禁，查看命令、输入、产出与真实耗时。</p></div>${stageTabs(indices)}${stageDetail(data.stages[selectedStage])}</section></div>`}
  function renderEvaluation(){const indices=[8,9],e=data.evaluationSummary||{},cases=Number(e.frozenCaseCount||0),wins=Number(e.rightWins||0),mean=e.candidateMeanElapsedMs;const accuracy=e.accuracyThreshold==null?'待行方配置':`${Number(e.accuracyThreshold*100).toFixed(1)}%`;const latency=e.p95LatencyThresholdMs==null?'待行方配置':`${Number(e.p95LatencyThresholdMs).toLocaleString()} ms`;if(!indices.includes(selectedStage))selectedStage=8;return `<div class="page-shell">${pageTitle('05','用统一标准检查 Agent 效果','Evaluation 通过 Candidate 调用银行授权测试系统，对照金标计算业务准确率和 P95 时延，再决定是否达到交付门槛。')}<div class="online-eval-flow"><div class="route-node external"><small>TEST INPUT</small><b>授权客户与业务任务</b><span>使用脱敏或授权客户引用及明确的预期结果。</span></div><div class="route-node"><small>CANDIDATE</small><b>运行待测 Agent</b><span>使用本轮 Lock 对应的 Candidate。</span></div><div class="route-node"><small>BANK SYSTEMS</small><b>调用行内测试系统</b><span>经 Provider 访问 CRM、持仓和产品接口。</span></div><div class="route-node"><small>MEASURE</small><b>记录结果与时延</b><span>逐条保留业务输出、状态、证据和耗时。</span></div><div class="route-node local"><small>JUDGE</small><b>对照门槛裁决</b><span>计算业务准确率、P95 时延并定位 Bad Case。</span></div></div><div class="metric-grid"><div class="metric-card"><small>冻结评测样例</small><b>${cases} 条</b><span>已完成的锁定证据回放；用于验证评测方法和专业能力增益。</span></div><div class="metric-card"><small>冻结对比结果</small><b>${wins}/${cases} 更优</b><span>安装财富专业包的一侧在专业 Judge 对比中胜出。</span></div><div class="metric-card pending"><small>在线业务准确率门槛</small><b>${esc(accuracy)}</b><span>必须由行方写入验收配置；当前不能计算在线准确率。</span></div><div class="metric-card pending"><small>在线 P95 时延门槛</small><b>${esc(latency)}</b><span>冻结回放平均耗时${mean==null?'暂无数据':`为 ${Number(mean).toLocaleString()} ms`}，不能替代在线 P95。</span></div></div><div class="eval-summary"><section class="eval-lane ok"><div class="eyebrow">FROZEN EVIDENCE REPLAY</div><h3>冻结评测 · ${cases} 条已完成</h3><p>使用锁定的财富 Evaluation Pack 回放历史证据，确认评测任务、专业 Judge 和报告契约能够运行。</p><div class="progress"><i></i></div><div class="eval-list"><div class="eval-item"><span>执行评测任务</span><strong>${cases} / ${cases}</strong></div><div class="eval-item"><span>专业能力增益</span><strong>${wins} / ${cases} 更优</strong></div><div class="eval-item"><span>报告生成</span><strong>完成</strong></div></div></section><section class="eval-lane pending"><div class="eyebrow">ONLINE BUSINESS EVALUATION</div><h3>行内系统验收 · 等待配置</h3><p>使用当前 Candidate、授权客户和银行测试接口执行在线评测，计算可交付的准确率与时延结论。</p><div class="progress"><i></i></div><div class="eval-list"><div class="eval-item"><span>准确率 / P95 门槛</span><strong>待配置</strong></div><div class="eval-item"><span>EA 部署身份 / 客户引用</span><strong>待提供</strong></div><div class="eval-item"><span>在线验收结论</span><strong>待执行</strong></div></div></section></div><section class="assembly-section"><div class="assembly-heading"><h3>查看本轮 Evaluation 执行明细</h3><p>冻结回放已经完成；在线验收将在行方门槛和授权环境就绪后执行。</p></div>${stageTabs(indices)}${stageDetail(data.stages[selectedStage])}</section></div>`}
  function renderRuntimeV2(){const indices=[3,4,5,6,7],s=data.solution,t=data.story,provider=s.providerRefs[0],requirement=s.profileRef.id==='employee-assisted'?'EA 部署身份和授权客户引用':'Provider 测试凭据和授权测试客户';if(!indices.includes(selectedStage))selectedStage=3;return `<div class="page-shell">${pageTitle('04','逐级证明 Candidate 能够运行',`${s.displayName} 已完成本地部署；${t.systems} 需要在授权测试环境中逐项验证返回。`)}<div class="runtime-route"><div class="route-node local"><small>BUILDER · LOCAL</small><b>自动部署 Candidate</b><span>安装依赖、编译 JAR、启动进程并执行健康检查。</span></div><div class="route-node"><small>${esc(s.displayName)}</small><b>${esc(t.capabilityLabel)}</b><span>生成 ${esc(t.capabilityId)} 的 CapabilityRequestV1。</span></div><div class="route-node"><small>FINANCE HARNESS</small><b>校验并路由</b><span>检查身份、能力编号和参数，选择 ${esc(provider.id)}。</span></div><div class="route-node"><small>${esc(t.providerLabel)}</small><b>${esc(provider.id)}</b><span>将统一请求翻译为本行接口调用。</span></div><div class="route-node external"><small>BANK · EXTERNAL</small><b>${esc(t.systems)}</b><span>在银行授权测试环境中返回真实业务结果。</span></div></div><div class="gate-matrix"><div class="matrix-row header"><div>验证层</div><div>必须证明什么</div><div>本轮证据</div><div>状态</div></div><div class="matrix-row"><div>Builder 本地部署</div><div>依赖可安装、Candidate 可编译、进程可启动</div><div>Maven 构建、JAR 摘要、健康端点检查</div><div class="matrix-status">已通过</div></div><div class="matrix-row"><div>金融能力合同</div><div>${esc(t.capabilityId)} 的 Request / Result 可校验</div><div>Finance Harness 自动测试</div><div class="matrix-status">已通过</div></div><div class="matrix-row"><div>Provider 装配</div><div>${esc(provider.id)} 和 Host Wiring 已进入 Candidate</div><div>Candidate 资产测试</div><div class="matrix-status">已通过</div></div><div class="matrix-row"><div>银行业务系统</div><div>${esc(t.systems)} 对授权请求返回正常</div><div>需要 ${esc(requirement)}</div><div class="matrix-status pending">待在线验证</div></div></div><div class="section-note"><b>Builder 能独立处理本地部署：</b>从安装 Harness 依赖到启动 Candidate 均由构建流程自动完成。银行系统接入的最终结论来自在线业务验收。</div><section class="assembly-section"><div class="assembly-heading"><h3>查看本轮工程验证明细</h3><p>点击任一门禁，查看命令、输入、产出与真实耗时。</p></div>${stageTabs(indices)}${stageDetail(data.stages[selectedStage])}</section></div>`}
  function renderEvaluationV2(){const indices=[8,9],s=data.solution,t=data.story,e=data.evaluationSummary||{},preview=t.evaluationPreview||{},cases=Number(e.frozenCaseCount||0),wins=Number(e.rightWins||0),mean=e.candidateMeanElapsedMs,previewCases=Number(preview.sampleCount||20),previewPassed=Number(preview.passedCount||0),previewAccuracy=Number(preview.accuracyPercent||0),previewAccuracyGate=Number(preview.accuracyThresholdPercent||85),previewP95=Number(preview.p95LatencyMs||0),previewP95Gate=Number(preview.p95LatencyThresholdMs||10000);if(!indices.includes(selectedStage))selectedStage=8;return `<div class="page-shell">${pageTitle('05','用统一标准检查 Agent 效果',`${s.displayName} 需要通过 ${t.systems} 完成在线业务验收，并检查 ${t.evaluationFocus}。`)}<div class="online-eval-flow"><div class="route-node external"><small>TEST INPUT</small><b>${esc(t.scenario)}测试任务</b><span>${esc(t.inputExample)}，并提供明确预期结果。</span></div><div class="route-node"><small>CANDIDATE</small><b>${esc(s.displayName)}</b><span>使用本轮 Lock 对应的 Candidate。</span></div><div class="route-node"><small>BANK SYSTEMS</small><b>银行测试接口</b><span>真实验收时经 ${esc(s.providerRefs[0].id)} 访问 ${esc(t.systems)}。</span></div><div class="route-node"><small>MEASURE</small><b>记录结果与时延</b><span>逐条检查 ${esc(t.outputExample)}。</span></div><div class="route-node local"><small>JUDGE</small><b>对照门槛裁决</b><span>计算业务准确率、P95 时延并定位 Bad Case。</span></div></div><div class="metric-grid"><div class="metric-card"><small>真实冻结证据</small><b>${cases} 条</b><span>${wins}/${cases} 个任务证明安装专业包后效果更优。</span></div><div class="metric-card pending"><small>演示推演样本</small><b>${previewPassed}/${previewCases} 通过</b><span>模拟 ${previewCases} 条银行验收任务，不作为真实结论。</span></div><div class="metric-card pending"><small>演示推演准确率</small><b>${previewAccuracy.toFixed(1)}%</b><span>暂按 ≥ ${previewAccuracyGate.toFixed(1)}% 展示；正式门槛由行方确认。</span></div><div class="metric-card pending"><small>演示推演 P95</small><b>${previewP95.toLocaleString()} ms</b><span>暂按 ≤ ${previewP95Gate.toLocaleString()} ms 展示；现有冻结回放均值${mean==null?'暂无数据':`为 ${Number(mean).toLocaleString()} ms`}。</span></div></div><div class="eval-summary"><section class="eval-lane ok"><div class="eyebrow">FROZEN EVIDENCE REPLAY · 真实证据</div><h3>冻结评测 · ${cases} 条已完成</h3><p>使用锁定的财富 Evaluation Pack 回放历史证据，确认任务、专业 Judge 和报告契约能够运行。</p><div class="progress"><i></i></div><div class="eval-list"><div class="eval-item"><span>执行评测任务</span><strong>${cases} / ${cases}</strong></div><div class="eval-item"><span>专业能力增益</span><strong>${wins} / ${cases} 更优</strong></div><div class="eval-item"><span>报告生成</span><strong>完成</strong></div></div></section><section class="eval-lane pending"><div class="eyebrow">ONLINE EVALUATION PREVIEW · 演示推演</div><h3>行内系统验收 · 模拟 ${previewCases} 条</h3><p>按照未来真实验收的数据结构推演结果展示；当前没有调用银行系统，也不会把本栏写入交付裁决。</p><div class="progress"><i style="width:${Math.min(100,Math.max(0,previewAccuracy))}%"></i></div><div class="eval-list"><div class="eval-item"><span>模拟任务完成</span><strong>${previewCases} / ${previewCases}</strong></div><div class="eval-item"><span>预计业务准确率</span><strong>${previewAccuracy.toFixed(1)}% / 门槛 ${previewAccuracyGate.toFixed(1)}%</strong></div><div class="eval-item"><span>预计 P95 时延</span><strong>${previewP95.toLocaleString()} / 门槛 ${previewP95Gate.toLocaleString()} ms</strong></div><div class="eval-item"><span>模拟 Bad Case</span><strong>${esc(preview.badCaseSummary||`${previewCases-previewPassed} 条`)}</strong></div><div class="eval-item"><span>真实验收状态</span><strong>待银行环境接入</strong></div></div></section></div><div class="section-note"><b>演示数据边界：</b>右侧推演用于讲清楚 Builder 如何执行 Evaluation。接入授权客户、银行测试接口和正式门槛后，本栏将由真实逐条结果替换，最终交付裁决仍保持“待验收”。</div><section class="assembly-section"><div class="assembly-heading"><h3>查看本轮 Evaluation 执行明细</h3><p>冻结回放已经完成；在线验收将在行方门槛和授权环境就绪后执行。</p></div>${stageTabs(indices)}${stageDetail(data.stages[selectedStage])}</section></div>`}
  function renderQualification(){const q=data.qualification,e=data.evaluationSummary||{},warning=data.report.warnings?.[0]||'等待完整验收结果';return `<div class="page-shell">${pageTitle('07','汇总证据并作出交付裁决','交付裁决同时依赖工程可运行、银行接口可用、业务准确率和 P95 时延达标，并通过 Lock 与 Report 保持可追溯。')}<div class="qualification-links"><button class="qualification-link" data-jump-story="runtime"><small>关联 STORY 05 · 工程与接口</small><b>Candidate 本地部署已通过</b><span>依赖、编译、启动、健康检查和 Provider 装配已有证据；银行接口仍待在线验证。点击查看。</span></button><button class="qualification-link pending" data-jump-story="evaluation"><small>关联 STORY 06 · 业务效果</small><b>在线准确率与 P95 时延待验收</b><span>行方门槛、部署身份和授权客户引用尚未提供。点击查看 Evaluation。</span></button></div><div class="decision"><section class="verdict"><small>DELIVERY GATE</small><h3>${q.qualified?'可以作为合格 Agent 交付':'等待银行在线业务验收'}</h3><p>${esc(q.status)}。工程侧 ${q.passedStages}/${q.totalStages} 个构建步骤通过；银行接口、在线准确率和 P95 时延完成验收后才能作出最终交付结论。</p><div class="gates"><div class="gate ok">资产版本可复现</div><div class="gate ok">Candidate 可编译并启动</div><div class="gate ${q.onlineEvaluationExecuted?'ok':'pending'}">银行业务接口${q.onlineEvaluationExecuted?'正常':'待验证'}</div><div class="gate ${e.accuracyThreshold!=null&&q.onlineEvaluationExecuted?'ok':'pending'}">业务准确率${e.accuracyThreshold==null?'门槛待配置':'待在线计算'}</div><div class="gate ${e.p95LatencyThresholdMs!=null&&q.onlineEvaluationExecuted?'ok':'pending'}">P95 时延${e.p95LatencyThresholdMs==null?'门槛待配置':'待在线计算'}</div><div class="gate ok">Lock 与 Report 已生成</div></div></section><section class="artifacts"><h3>最终交付包</h3><div class="artifact"><b>Candidate Agent</b><span>${esc(data.report.candidateArtifact?.path||'尚未生成')}</span></div><div class="artifact"><b>资产版本锁</b><span>solution-lock.json</span></div><div class="artifact"><b>构建与验证报告</b><span>build-report.json</span></div><div class="artifact"><b>当前未完成事项</b><span>${esc(warning)}</span></div></section></div>${renderOptimization()}</div>`}
  function renderOptimization(){return `<div class="improve"><div class="improve-title"><span>QUALIFICATION LOOP</span><b>未通过项怎样处理</b></div>${data.optimization.map(x=>`<div class="loop-step ${esc(x.state)}"><span>${esc(x.step)}</span><b>${x.state==='done'?'已完成':x.state==='active'?'当前建议':'待执行'}</b><p>${esc(x.text)}</p></div>`).join('')}</div>`}
  function bindStoryLinks(){document.querySelectorAll('[data-jump-story]').forEach(button=>button.onclick=()=>{story=button.dataset.jumpStory;renderPage()})}
  function renderPage(){document.querySelectorAll('[data-story-target]').forEach(node=>node.classList.toggle('active',node.dataset.storyTarget===story));const pages={goal:renderGoal,solution:renderSolution,needs:renderNeedsV2,assemble:renderAssemble,runtime:renderRuntimeV2,evaluation:renderEvaluationV2,qualification:renderQualification};$('page').innerHTML=pages[story]();$('page').scrollTop=0;bindStageTabs();bindAssemblyExplorer();bindStoryLinks()}
  function bindStory(){document.querySelectorAll('[data-story-target]').forEach(node=>node.onclick=()=>{if(!data)return;story=node.dataset.storyTarget;renderPage()})}
  async function load(id='wealth-manager-previsit-v1.1'){setControlsEnabled(false);const version=++loadVersion;try{const response=await fetch(`/api/demo?id=${encodeURIComponent(id)}`);if(!response.ok)throw new Error(`演示数据加载失败（HTTP ${response.status}）`);const payload=normalizePayload(await response.json(),id);if(version!==loadVersion)return;data=payload;story='goal';selectedStage=0;selectedAssembly='solution';renderDemos();$('storyGoal').textContent=`业务需求 · ${data.story.scenario}`;setControlsEnabled(true);renderPage()}catch(error){if(version!==loadVersion)return;$('page').innerHTML=`<div class="page-shell"><div class="load-error"><b>演示数据暂时无法加载</b><p>${esc(error.message)}</p><button type="button" onclick="load('${esc(id)}')">重新加载</button></div></div>`}}
  bindStory();load(new URLSearchParams(location.search).get('demo')||undefined);
