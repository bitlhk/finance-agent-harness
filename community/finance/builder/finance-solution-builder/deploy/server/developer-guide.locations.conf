# Include inside the Studio HTTPS server; keep server-level Basic authentication.
# Only the reviewed public HTML/PDF are anonymous. Internal files inherit login.
# Do not alias the source repository or export root.
location = /developer-guide {
    return 302 /developer-guide/;
}

location = /developer-guide/ {
    auth_basic off;
    rewrite ^ /developer-guide/index.html last;
}

location = /developer-guide/index.html {
    auth_basic off;
    limit_except GET { deny all; }
    alias /srv/finance-studio/developer-guide/public-current/index.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}

location = /developer-guide/handbook.pdf {
    auth_basic off;
    limit_except GET { deny all; }
    alias /srv/finance-studio/developer-guide/public-current/handbook.pdf;
    default_type application/pdf;
    add_header Cache-Control "no-store" always;
    add_header Content-Disposition 'inline; filename="Finance-Harness-Public-Guide.pdf"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=86400" always;
}

location = /developer-guide/internal {
    return 302 /developer-guide/internal/;
}

location = /developer-guide/internal/ {
    rewrite ^ /developer-guide/internal/index.html last;
}

location = /developer-guide/internal/index.html {
    limit_except GET { deny all; }
    alias /srv/finance-studio/developer-guide/current/index.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}

location = /developer-guide/internal/handbook.pdf {
    limit_except GET { deny all; }
    alias /srv/finance-studio/developer-guide/current/handbook.pdf;
    default_type application/pdf;
    add_header Cache-Control "private, no-store" always;
    add_header Content-Disposition 'inline; filename="Finance-Harness-Developer-Guide.pdf"' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=86400" always;
}

location ^~ /developer-guide/ {
    return 404;
}
