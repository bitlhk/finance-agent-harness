{
  "schemaVersion": "finance-capability-pack.v1",
  "packId": "curated-synthetic-customer",
  "version": "1.1.0",
  "systemPrompt": "Synthetic MCP tools only. Tool names have curated_ prefixes and require explicit Skill migration. customer_id always equals the trusted Host subjectRef. BOUND_SUBJECT maps that identity to one configured source customer. Only server-enabled SYNTHETIC_ALLOWLIST additionally requires synthetic_customer_id with the user's explicit test customer; this resource selector never replaces Host identity or grants. Never infer the mode or select a default customer. COMPLETED means the read completed, not business approval. Preserve sourceState, gaps and source identity; never claim live data.",
  "capabilities": [
    {
      "capabilityId": "eval.synthetic.get-customer-profile.query",
      "toolName": "curated_get_customer_profile",
      "name": "Synthetic get_customer_profile",
      "description": "Read-only reference_mcp fixture via actual MCP; not live data or authorization. Source tool: get_customer_profile. Preserve unknown, unavailable, degraded and missing facts. Requires explicit Skill migration binding.",
      "operation": "QUERY",
      "inputSchema": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "customer_id": {
            "type": "string",
            "description": "Required trusted Host subjectRef in every mode, never a source customer ID or model-inferred identity."
          },
          "synthetic_customer_id": {
            "type": "string",
            "description": "Only with server-enabled SYNTHETIC_ALLOWLIST: the user's explicit synthetic test customer. Do not choose a first/default customer. Required in that mode, forbidden in BOUND_SUBJECT. The Provider checks the Host subject's per-tool resource allowlist."
          }
        },
        "required": [
          "customer_id"
        ]
      },
      "requiredScopes": [
        "eval:synthetic:get_customer_profile:read"
      ]
    }
  ]
}
