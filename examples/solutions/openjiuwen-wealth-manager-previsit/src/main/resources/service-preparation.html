<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户经理服务准备 · 隔离验收</title>
<style>
:root{font-family:system-ui,sans-serif;color:#202226;background:#f5f6f8;font-size:15px;letter-spacing:0}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #ddd;padding:20px 28px}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:0 0 16px}p{line-height:1.6}.muted{color:#595e68;font-size:13px}.badge{color:#a91d36;font-weight:600}nav{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:24px;font-weight:600}section{padding:24px 0;border-top:1px solid #ddd}.fields{display:grid;grid-template-columns:1fr 2fr;gap:16px}label{display:block;font-weight:600}input,select,textarea{display:block;width:100%;padding:11px;border:1px solid #aab0ba;border-radius:4px;font:inherit;margin:8px 0 16px}textarea{min-height:85px;resize:vertical}button{font:inherit;padding:10px 16px;background:#ac1934;color:white;border:1px solid #ac1934;border-radius:4px;cursor:pointer}button.secondary{background:white;color:#333;border-color:#aaa}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fact{background:white;border:1px solid #d9dce2;border-radius:6px;padding:16px;overflow-wrap:anywhere}.fact strong{display:block;margin-bottom:8px}.warning{color:#963409;background:#fff3e8;padding:12px;border-left:3px solid #bb6224}pre{white-space:pre-wrap;word-break:break-word;background:white;border:1px solid #ddd;padding:14px;font-size:13px}a{color:#a91d36}:focus-visible{outline:2px solid #2357a2;outline-offset:3px}[hidden]{display:none!important}@media(max-width:640px){main{padding:16px}header{padding:16px}.fields,.facts{grid-template-columns:1fr}nav{gap:12px;font-size:13px}h1{font-size:21px}}
</style></head><body>
<header><span class="badge">Finance Harness · 客户经营</span><h1>客户经理服务准备</h1><p class="muted" id="mode">隔离验收 · 合成身份与数据 · 未连接线上 CRM</p></header>
<main><nav aria-label="任务步骤"><span>01 客户与目标</span><span>02 事实汇集</span><span>03 准备报告</span><span>04 经理复核</span></nav>
<section><h2>客户与服务目标</h2><div class="fields"><label>授权合成客户<select id="customer"><option value="">请选择客户</option></select></label><label>本次服务目标<input id="goal" maxlength="500" placeholder="例如：核实资金情况，准备持有期回访"></label></div><div class="actions"><button id="prepare">汇集事实并生成报告</button><button id="clear" class="secondary">清空当前选择</button></div><p id="message" role="status" aria-live="polite"></p></section>
<div id="report" hidden><section><h2>客户事实</h2><p id="source" class="muted"></p><div id="facts" class="facts"></div><div id="missing" class="warning" hidden></div></section>
<section><h2>服务准备报告 <span id="status" class="badge"></span></h2><p id="reportGoal"></p><ul id="focus"></ul><p class="muted">产品资料未接入。本报告不是投资建议或业务办理结果。</p><div class="actions"><button id="replay" class="secondary">查看保存的运行记录</button></div><details><summary>引用资产与版本</summary><pre id="assets"></pre></details><details id="record"><summary>本次运行证据</summary><pre id="evidence"></pre></details></section>
<section><h2>经理复核</h2><label>复核意见与修改原因<textarea id="opinion" maxlength="2000" placeholder="记录已核实内容、尚缺信息及沟通安排"></textarea></label><button id="save">保存复核意见</button><p id="reviewState" class="muted">待复核 · 仅保存到 Harness 报告记录，不写 CRM</p></section></div></main>
<script>
const el=id=>document.getElementById(id);let csrf='',current=null,epoch=0,busy=false,selectionSync=Promise.resolve();
const statusNames={READY_FOR_REVIEW:'待经理复核',PARTIAL:'报告未完整生成',FAILED:'事实查询失败',RUNNING:'生成中',DISCARDED:'旧结果已丢弃'};
async function api(action,body){const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'请求未完成');return data}
function message(s){el('message').textContent=s}
function invalidate(){epoch++;current=null;el('report').hidden=true;el('opinion').value='';
// Invalidate the server generation as well; restoring a draft never triggers preparation.
selectionSync=selectionSync.catch(()=>{}).then(()=>api('select',{customer:el('customer').value,goal:el('goal').value}).catch(()=>{}));}
el('customer').addEventListener('change',invalidate);el('goal').addEventListener('input',invalidate);
el('clear').onclick=()=>{el('customer').value='';el('goal').value='';invalidate();message('当前选择已清空，原运行记录仍保留。')};
function show(r){current=r;el('report').hidden=false;el('status').textContent=statusNames[r.status]||r.status;el('reportGoal').textContent='服务目标：'+r.goal;
el('source').textContent='客户：'+r.customerAlias+' · 数据时间：'+(r.dataAsOf||'未取得')+' · 来源：'+(r.execution?.data?.sourceSystem||'未取得');
el('facts').replaceChildren();const customer=r.facts?.customer||{};
const labels={customerId:'客户引用',displayName:'客户名称',totalAssets:'资产总额',riskLevel:'风险等级',visitGoal:'服务记录'};
for(const [k,v] of Object.entries(customer)){const card=document.createElement('div');card.className='fact';const title=document.createElement('strong');title.textContent=labels[k]||k;const value=document.createElement('span');value.textContent=typeof v==='object'?JSON.stringify(v):String(v);card.append(title,value);el('facts').append(card)}
el('missing').hidden=!(r.missingEvidence?.length);el('missing').textContent='缺项／待核实：'+(r.missingEvidence||[]).map(v=>typeof v==='string'?v:JSON.stringify(v)).join('；');
el('focus').replaceChildren();for(const ref of r.focusFactRefs||[]){const k=ref.split('/').pop().replaceAll('~1','/').replaceAll('~0','~');const li=document.createElement('li');li.textContent='与客户核实'+(labels[k]||k)+'，确认是否发生变化。';el('focus').append(li)}
if(r.explanationStatus==='FAILED'){const li=document.createElement('li');li.textContent='沟通重点未生成；已取得事实保留，需人工补充。';el('focus').append(li)}
el('assets').textContent=JSON.stringify(r.assets,null,2);el('evidence').textContent=JSON.stringify({runId:r.runId,sourceReceipt:r.sourceReceipt,evidence:r.execution?.evidence,events:r.events},null,2);
el('reviewState').textContent=r.reviewStatus==='REVIEWED'?'已保存复核意见 · '+r.reviewedAt+' · 业务状态保持不变':'待复核 · 仅保存到 Harness 报告记录，不写 CRM';}
el('prepare').onclick=async()=>{if(busy)return;if(!el('customer').value||!el('goal').value.trim()){message('请选择客户并填写服务目标。');return}busy=true;el('prepare').disabled=true;const own=++epoch;message('正在汇集事实与生成准备报告…');try{await selectionSync;const s=await api('select',{customer:el('customer').value,goal:el('goal').value});if(own!==epoch)return;const r=await api('prepare',{generation:s.generation});if(own===epoch){show(r);message('报告已保存，等待经理复核。')}}catch(e){if(own===epoch)message('未完成：'+e.message)}finally{busy=false;el('prepare').disabled=false}};
el('save').onclick=async()=>{if(!current)return;const own=epoch;el('save').disabled=true;try{const r=await api('review',{reportId:current.reportId,revision:current.reportRevision,opinion:el('opinion').value});if(own===epoch){show(r);message('复核意见已保存，未写入 CRM。')}}catch(e){message('保存失败：'+e.message)}finally{el('save').disabled=false}};
el('replay').onclick=async()=>{if(!current)return;const own=epoch;try{const r=await api('read',{reportId:current.reportId});if(own===epoch){show(r);el('record').open=true;message('已读取原运行证据，没有重新查询。')}}catch(e){message('读取失败：'+e.message)}};
fetch('/api/bootstrap').then(r=>r.json()).then(b=>{csrf=b.csrf;for(const name of b.customers){const o=document.createElement('option');o.value=name;o.textContent=name;el('customer').append(o)}el('mode').textContent='隔离验收 · '+(b.mode==='CONTROLLED_HTTP_FIXTURE'?'确定性重点整理与合成 HTTP 数据源':'真实模型与合成 HTTP 数据源')+' · 未连接线上 CRM'}).catch(()=>message('初始化失败，请检查隔离服务。'));
</script></body></html>
