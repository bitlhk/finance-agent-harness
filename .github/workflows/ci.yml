name: Harness CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-developer-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engineering/offline-docs/package-lock.json
      - name: Install public guide renderer
        run: npm ci --prefix engineering/offline-docs
      - name: Verify public guide content and diagrams
        run: node --test engineering/offline-docs/test-public-content.mjs engineering/offline-docs/public-link-policy.test.mjs engineering/offline-docs/test-public-diagrams.mjs
      - name: Build public guide
        run: node engineering/offline-docs/build-public.mjs "$RUNNER_TEMP/public-guide"
  offline-contracts-and-java:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engineering/requirements-conformance.txt
      - name: Install contract validator
        run: python -m pip install -r engineering/requirements-conformance.txt
      - name: Collector dependency byte reproducibility
        if: matrix.python == '3.12'
        run: python engineering/verify_reproducible_jars.py --report "$RUNNER_TEMP/harness-reproducibility/report.json"
      - name: Offline schema and negative fixture gate
        run: python engineering/verify_contracts.py
      - name: Candidate component assembly declarations
        run: python engineering/verify_component_assembly.py
      - name: Unit tests and local HTTP fault injection
        run: mvn -B -ntp verify
      - name: Java timestamp compatibility on supported Python versions
        run: python -m unittest discover -s engineering -p 'test_*.py' -v
      - name: Controlled developer entrypoint (no external model or bank)
        run: bash examples/solutions/wealth-facts-kit/run-controlled.sh
      - name: Verify CLI evidence and business results
        run: python engineering/verify_wealth_kit.py
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-test-results-python-${{ matrix.python }}
          path: |
            **/target/surefire-reports/*.xml
            integrations/openjiuwen-java/target/java-instant-cases.json
            examples/solutions/wealth-facts-kit/target/runs/**
            ${{ runner.temp }}/harness-reproducibility/*
