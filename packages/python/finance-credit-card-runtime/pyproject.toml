[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "finance-credit-card-runtime"
version = "0.1.0"
description = "Credit-card reference runtime contracts and read-only capabilities"
requires-python = ">=3.11.4,<3.14"
license = {text = "Apache License 2.0"}
dependencies = ["pydantic>=2.10,<3"]
[project.optional-dependencies]
forecast = ["lightgbm==4.6.0", "numpy==2.2.6", "scipy==1.15.3"]
service = ["openjiuwen==0.1.16", "openai==2.48.0", "httpx==0.28.1"]
[tool.setuptools.packages.find]
where = ["src"]
